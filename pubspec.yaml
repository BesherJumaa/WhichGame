name: whichgame
description: Which Game? - a fast multiplayer game picker and team builder.
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_native_splash:
  color: '#0B0B12'
  image: asset/app_icon_foreground.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: '#0B0B12'
    icon_background_color: '#0B0B12'
    image: asset/app_icon_foreground.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 26
  image_path: asset/app_icon.png
  adaptive_icon_background: '#0B0B12'
  adaptive_icon_foreground: asset/app_icon_foreground.png
  windows:
    generate: true
    image_path: asset/app_icon.png
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - images/
    - images/games/
    - images/generals/
    - asset/
