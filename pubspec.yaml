name: whichgame
description: Which Game? - a lightweight game and team chooser.
publish_to: 'none'
version: 1.2.1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_native_splash:
  color: '#42A5F5'
  image: images/logo.png
  android: true
  ios: true
  android_gravity: center
  android_12:
    color: '#42A5F5'
    image: images/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  min_sdk_android: 26
  image_path: asset/launcher.png
  image_path_ios: asset/launcherr.jpg

flutter:
  uses-material-design: true
  assets:
    - images/
    - asset/
